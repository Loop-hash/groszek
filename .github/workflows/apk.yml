name: APK

# Buduje apkę na Androida przy każdej zmianie w app/ albo w przepisach i wystawia ją
# jako wydanie "najnowsza": https://github.com/Loop-hash/groszek/releases/tag/najnowsza

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Zależności i testy
        working-directory: app
        run: |
          set -o pipefail
          mkdir -p ../debug
          npm ci 2>&1 | tee ../debug/npm.log
          if [ -f test/run.js ]; then node test/run.js 2>&1 | tee ../debug/test.log; fi

      - name: Dane i numer wersji
        working-directory: app
        run: |
          mkdir -p www/data
          for f in promos recipes ingredients; do
            if [ -f ../data/$f.json ]; then cp ../data/$f.json www/data/; fi
          done
          # odcisk części androidowej: gdy się nie zmienił, telefon bierze samą stronę (groszek-www.zip)
          # zamiast całego APK i nie musi niczego instalować
          NATIVE=$(cd .. && git ls-files app/android app/package.json app/package-lock.json app/capacitor.config.json | sort | xargs sha256sum | sha256sum | cut -c1-12)
          # czytnik paragonów (kilkanaście MB) ma osobną paczkę i pobiera się tylko, gdy się zmienił
          VENDOR=$(cd www/js/vendor && find . -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          printf '{"build": %s, "sha": "%s", "date": "%s", "native": "%s", "vendor": "%s"}\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" "$NATIVE" "$VENDOR" > www/build.json
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
          cat www/build.json
          cd www
          zip -qrX ../../groszek-www.zip . -x 'js/vendor/*'
          zip -qrX ../../groszek-vendor.zip js/vendor
          ls -la ../../groszek-www.zip ../../groszek-vendor.zip

      - name: Budowanie APK
        working-directory: app
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee ../debug/sync.log
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../debug/gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../../groszek.apk
          ls -la ../../groszek.apk | tee -a ../../debug/gradle.log

      - name: Wydanie "najnowsza"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Groszek 0.1.${GITHUB_RUN_NUMBER}

          Pobierz plik groszek.apk niżej i otwórz go na telefonie z Androidem.
          Przy pierwszej instalacji telefon zapyta o zgodę na instalowanie z tego źródła.
          Później Groszek aktualizuje się sam przyciskiem w Ustawieniach.

          build: ${GITHUB_RUN_NUMBER}
          native: ${NATIVE}"
          # Podmiana bez przerwy: najpierw cały nowy plik pod inną nazwą, potem szybka zamiana nazw.
          # Wcześniej stary plik znikał na czas wgrywania nowego i pobieranie w tym momencie się psuło.
          swap() {
            cp "$1" "nowa-$1"
            gh release upload najnowsza "nowa-$1" --clobber
            OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/najnowsza" -q ".assets[] | select(.name==\"$1\") | .id")
            NEW=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/najnowsza" -q ".assets[] | select(.name==\"nowa-$1\") | .id")
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW" -f name="$1" > /dev/null
          }
          if gh release view najnowsza >/dev/null 2>&1; then
            # stara nazwa tymczasowa z poprzednich wersji tego kroku
            STALE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/najnowsza" -q '.assets[] | select(.name=="groszek-nowa.apk") | .id')
            if [ -n "$STALE" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$STALE"; fi
            # notatki (numer wersji) zmieniają się na końcu, gdy wszystkie pliki są już nowe
            swap groszek-vendor.zip
            swap groszek-www.zip
            swap groszek.apk
            gh release edit najnowsza --title "Groszek 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES"
          else
            gh release create najnowsza groszek.apk groszek-www.zip groszek-vendor.zip --title "Groszek 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

      - name: Logi na gałąź ci-apk
        if: always()
        run: |
          mkdir -p debug
          echo "run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA} ${{ job.status }}" > debug/status.txt
          cd debug
          git init -q
          git config user.name groszek-bot
          git config user.email groszek-bot@users.noreply.github.com
          git checkout -q -b ci-apk
          git add -A
          git commit -q -m "Logi budowania ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-apk
